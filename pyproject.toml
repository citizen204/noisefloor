[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "noisefloor"
version = "0.1.0"
description = "A SOC triage drill that grades your reasoning, not just your verdict"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Xi Chen" }]
keywords = ["security", "soc", "triage", "incident-response", "blue-team", "training"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Programming Language :: Python :: 3.9",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
noisefloor = "noisefloor.cli:main"

[project.urls]
Homepage = "https://github.com/citizen204/noisefloor"

[tool.setuptools.packages.find]
include = ["noisefloor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
